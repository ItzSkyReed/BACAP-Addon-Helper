# Path to the directory containing extracted Minecraft registry JSON files
RegistryBasePath: "./registries"

# Filesystem paths for each target datapack.
# Namespaces, rewards, milestone paths, and tier message formatting are built directly into the generator.
Datapacks:
  # Base BlazeandCave's Advancements Pack (ReadOnly source)
  bacap:
    Path: "./datapacks/bacap_datapack"

  # BACAP Enhanced addon (ReadWrite target)
  bacaped:
    Path: "./datapacks/bacaped_datapack"
    LanguagePackPath: "./resourcepacks/lang_pack"

  # BACAP Enhanced Hardcore variant (ReadWrite target)
  bacaped_hardcore:
    Path: "./datapacks/bacaped_datapack"
    LanguagePackPath: "./resourcepacks/lang_pack"