# Path to the directory containing extracted Minecraft registry JSON files
# Can be generated by launching minecraft server with https://github.com/ItzSkyReed/registry-dumper
registry_base_path: "./registries"

# Target directory where generated release archives (.zip) will be saved
release_path: "./releases"

# TEMPLATES
# Define reusable settings for validation, language packs, and checklists.
# Datapacks can inherit these configurations using 'template: <name>'
# with automatic deep property merging (explicit values override template defaults).
templates:
  validation:
    default:
      # Master toggle for the entire validation engine for inheriting datapacks
      enabled: true

      # Ensures advancement titles follow English Title Case conventions
      title_case_formatting:
        enabled: true
        severity: info # Available severity levels: info, warning, error
        use_default_minor_words: true
        # Words that stay lowercase unless they are the first or last word of the title
        minor_words: [ "a", "an", "the", "and", "but", "or", "for", "of", "in", "to", "with", "vs" ]
        # Titles that completely bypass Title Case validation
        allowed_titles:
          - "Say NO to Campfires"
          - "Craft Me ALL!"
          - "CoolGrill"
          - "TeleFoxing"
          - "SnifferSniffEvent"
          - "HR Manager of the Year"

      # Detects accidental leading or trailing spaces in titles and descriptions
      whitespace_trimming:
        enabled: true
        severity: error

      # Prevents raw text strings in UI, enforcing translatable components
      plain_text_usage:
        enabled: true
        severity: error
        # Automatically includes default system trigger strings (/trigger bac_...)
        include_default_strings: true
        # Custom literal strings allowed in text components
        allowed_strings:
          - "/trigger bacaped_mob_universe"
          - "/trigger bacaped_egapple_a_day"

      # Verifies that reward mcfunction files follow naming conventions and exist on disk
      reward_paths:
        enabled: true
        severity: error

      # Verifies that parent advancements exist across loaded packs and checks for circular dependencies
      parent_references:
        enabled: true
        severity: error

  language_pack:
    default:
      # Automatically ignores built-in branding (GitHub, Discord, etc.) and announcement templates
      use_default_ignored_keys: true

      # Excludes standard vanilla Minecraft keys (e.g., item.minecraft.*, entity.minecraft.*)
      exclude_vanilla_keys: true

      # Removes unused keys from translation files while syncing
      remove_unused_keys: true

      # Additional translation keys or literals to exclude from discovery
      ignored_keys:
        - "DonationAlerts"
        - "Patreon"

      # Multiline header written as comments at the top of base_translation.json
      # Using '|-' preserves line breaks without a trailing empty newline
      base_translation_header: |-
        Enhanced Discoveries Language File

        How to use: Name and descriptions of advancement to left of ':' and put translation to right of ':',
        inside the speech marks "" like this: "Advancement Description"
        Some advancement titles make use of puns that would work in English but probably not in other languages.
        Be creative if you wish if you can find any puns in foreign languages.

        Language: Your Language
        Author: Names

  # Reusable checklist template definitions for scan distance, colors, and layout
  checklist:
    default:
      # Default entity search radius around the executing player (in blocks)
      distance: 64

      # Styling parameters applied to the generated in-game tellraw output
      style:
        # Color applied to tracked entities that have been located or verified
        complete_color: "#00a523"

        # Color applied to tracked entities that are still missing
        incomplete_color: "#c2c2c2"

        # Color for punctuation and connecting text (e.g., commas, " and ")
        separator_color: "#c2c2c2"

        # Color for the top and bottom strikethrough divider lines
        divider_color: "dark_gray"


# DATAPACKS
# Filesystem paths, domains, and settings for each loaded datapack.
datapacks:

  # Base BlazeandCave's Advancements Pack (Read-only reference)
  bacap:
    path: "./datapacks/bacap_datapack"
    main_namespace: "blazeandcave"
    reward_namespace: "bacap_rewards"
    type: "reference" # Reference packs are never modified on disk


  # BACAP Enhanced Main Addon
  bacaped:
    path: "./datapacks/bacaped_datapack"
    main_namespace: "bacaped"
    reward_namespace: "bacaped_rewards"
    fanpacks_namespace: "bacaped_fanpacks"
    type: "addon"
    release_name: "Enhanced Discoveries"

    # Reward & milestone advancements
    advancement_legend_mc_path: "bacaped:bacap/enhanced_legend"
    milestone_mc_paths:
      adventure: "bacaped:bacap/enhanced_adventure_milestone"
      animal: "bacaped:bacap/enhanced_animal_milestone"
      biomes: "bacaped:bacap/enhanced_biomes_milestone"
      building: "bacaped:bacap/enhanced_building_milestone"
      challenges: "bacaped:bacap/enhanced_challenges_milestone"
      enchanting: "bacaped:bacap/enhanced_enchanting_milestone"
      end: "bacaped:bacap/enhanced_end_milestone"
      farming: "bacaped:bacap/enhanced_farming_milestone"
      mining: "bacaped:bacap/enhanced_mining_milestone"
      monsters: "bacaped:bacap/enhanced_monsters_milestone"
      nether: "bacaped:bacap/enhanced_nether_milestone"
      potion: "bacaped:bacap/enhanced_potion_milestone"
      redstone: "bacaped:bacap/enhanced_redstone_milestone"
      statistics: "bacaped:bacap/enhanced_statistics_milestone"
      weaponry: "bacaped:bacap/enhanced_weaponry_milestone"

    # Inherit full default validation rules
    validation:
      template: default

    # Inherit language pack settings and define resource pack root folder
    language_pack:
      template: default
      path: "./resourcepacks/Enhanced_Discoveries_Language_Pack"

    # Checklists
    # Defines interactive checklist systems (/trigger callbacks and advancement validation functions)
    # used to monitor and display real-time entity completion status.
    checklists:

      # Mob Universe: Tracks the presence of all dimension-specific mobs in Minecraft
      - id: "mob_universe"
        template: default
        # Command storage resource key used for runtime NBT manipulation
        storage_name: "bacaped_mob_universe_storage"
        # Objective name reset after trigger execution (/trigger bacaped_mob_universe)
        trigger_scoreboard: "bacaped_mob_universe"
        # Detection radius around the player (in blocks)
        distance: 128
        # Output directory relative to data/<namespace>/function/ for *_check.mcfunction files
        check_subfolder: "mob_universe"
        # Function filename placed under data/<namespace>/function/triggers_callback/
        trigger_filename: "mob_universe_trigger.mcfunction"
        # Header translation key displayed at the top of the chat output
        header_translate_key: "Mob list for the current dimension of the Mob Universe Advancement"
        # Sub-groups or dimension-specific tracking lists
        categories:
          - name: "overworld"
            advancement: "bacaped:challenges/mob_universe overworld"
            # Optional dimension requirement; message only displays if player matches
            dimension_requirement: "minecraft:overworld"
            prefix_text: "Overworld: "
            prefix_color: "green"
            # Entity identifiers; supports pre-registered preset shortcuts prefixed with '@'
            entities:
              - "@all_overworld"

          - name: "nether"
            advancement: "bacaped:challenges/mob_universe nether"
            dimension_requirement: "minecraft:the_nether"
            prefix_text: "Nether: "
            prefix_color: "red"
            entities:
              - "@all_nether"

          - name: "end"
            advancement: "bacaped:challenges/mob_universe end"
            dimension_requirement: "minecraft:the_end"
            prefix_text: "End: "
            prefix_color: "dark_purple"
            entities:
              - "@all_end"

      # Baby Zoo: Tracks all breedable passive baby mob variants
      - id: "baby_zoo"
        template: default
        storage_name: "bacaped_baby_zoo_storage"
        trigger_scoreboard: "bacaped_baby_zoo"
        distance: 32
        # Target selector predicates or tags appended to @e[...] queries (without leading comma)
        extra_selector: "predicate=bacaped:is_baby"
        # Omitting check_subfolder writes check functions directly into data/<namespace>/function/
        trigger_filename: "baby_zoo_trigger.mcfunction"
        header_translate_key: "Baby Zoo list"
        categories:
          - name: "baby_zoo"
            advancement: "bacaped:animal/baby_zoo"
            entities:
              - "@baby_zoo"

  # BACAP Enhanced Hardcore Variant (Compatibility addon)
  bacaped_hardcore:
    path: "./datapacks/bacaped_hardcore_datapack"
    main_namespace: "bacaped"
    reward_namespace: "bacaped_rewards"
    type: "compatibility_addon"
    parent_datapack_id: "bacaped" # Links this pack to the main addon above
    release_name: "Enhanced Discoveries Hardcore"

    # Override controls for compatibility rewards
    compatibility_addon_settings:
      override_msg: true
      override_exp_rewards: false
      override_item_rewards: false
      override_trophy_rewards: false

    # Inherit default validation, overriding only specific rules
    validation:
      template: default

    # Inherits language pack rules from template and points to the shared language pack
    language_pack:
      template: default
      path: "./resourcepacks/Enhanced_Discoveries_Language_Pack"