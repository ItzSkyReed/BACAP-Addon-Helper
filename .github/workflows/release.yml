name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - rid: win-x64
            binary-ext: .exe
          - rid: win-arm64
            binary-ext: .exe
          # Linux
          - rid: linux-x64
            binary-ext: ''
          - rid: linux-arm64
            binary-ext: ''
          # macOS
          - rid: osx-x64
            binary-ext: ''
          - rid: osx-arm64
            binary-ext: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Self-contained build (standalone, .NET not required)
      - name: Publish Self-Contained (${{ matrix.rid }})
        run: >
          dotnet publish src/UI/UI.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./dist/self-contained

      # Framework-dependent build (lightweight single-file, requires .NET 10)
      - name: Publish Framework-Dependent (${{ matrix.rid }})
        run: >
          dotnet publish src/UI/UI.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./dist/framework-dependent

        # Preparing and renaming binaries
      - name: Prepare Binaries
        run: |
          mkdir -p ./release-binaries
          
          cp ./dist/self-contained/BACAP_Addon_Helper${{ matrix.binary-ext }} \
             ./release-binaries/BACAP_Addon_Helper-${{ matrix.rid }}${{ matrix.binary-ext }}
          
          cp ./dist/framework-dependent/BACAP_Addon_Helper${{ matrix.binary-ext }} \
             ./release-binaries/BACAP_Addon_Helper-framework-dependent-${{ matrix.rid }}${{ matrix.binary-ext }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.rid }}
          path: ./release-binaries/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}